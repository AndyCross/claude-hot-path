name: bench
on:
  pull_request:
  push:
    branches: [main]
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v7
        with:
          go-version-file: mock/go.mod
      - run: ./bench/bench.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/*.csv
